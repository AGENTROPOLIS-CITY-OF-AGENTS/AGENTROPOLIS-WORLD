name: Deploy AGENTROPOLIS-WORLD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build world
        env:
          VITE_BASE_PATH: /AGENTROPOLIS-WORLD/
        run: npm run build

      - name: Activate Agentropolis spatial runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text()
          tag = '<script src="./spatial-runtime.js" defer></script>'
          if tag not in s:
              s = s.replace('</head>', f'{tag}</head>')
              p.write_text(s)
          PY

      - name: Pin the built baseline
        run: REQUIRE_DIST=1 npm test

      - name: Install Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -fsSL -o /tmp/google-chrome-stable_current_amd64.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome-stable_current_amd64.deb
          fi
          google-chrome --version

      - name: Headless smoke of the Pages artifact
        run: npm run smoke

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4