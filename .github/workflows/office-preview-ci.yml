name: Hermes office preview verification
on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/office-preview-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and typecheck
        run: npm run build
      - name: Confirm default-off and no external film provider
        run: |
          grep -Fq 'get("office") === "demo"' src/main.tsx
          grep -Fq 'DEMO · NOT LIVE' src/main.tsx
          if grep -Ein 'higgsfield|neo.tokyo' src/hermes-office.tsx src/main.tsx; then
            echo "Forbidden provider or spelling found"
            exit 1
          fi
